# Factory CI (owner request #157): every change to the factory's own code runs the same checks a reviewer relies on,
# so high-risk factory changes (deploy scripts, the dispatcher) are backed by CI output, not only pasted evidence.
# Read-only token, no secrets, actions pinned to commit SHAs. macOS, because the deploy scripts target the owner's Mac.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Dependency audit (0 critical, high or medium)
        run: npm audit --audit-level=moderate

      - name: Shell syntax
        run: for f in deploy/*.sh bin/sf; do bash -n "$f"; done

      - name: Tools
        run: brew install shellcheck gitleaks

      - name: shellcheck
        run: shellcheck deploy/*.sh

      - name: Secret scan
        run: gitleaks git --redact --no-banner .

      - name: Tests
        run: node --test tests/
